<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#09090b"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#fafafa" font-size="20" font-weight="700">시스템 아키텍처</text>

  <!-- ===== INPUT SECTION ===== -->
  <text x="100" y="85" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="1">INPUT</text>

  <!-- PDF/Image Upload -->
  <rect x="30" y="100" width="140" height="70" rx="8" fill="#18181b" stroke="#27272a" filter="url(#shadow)"/>
  <text x="100" y="130" text-anchor="middle" fill="#a1a1aa" font-size="11">사용자 업로드</text>
  <text x="100" y="150" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">PDF / 이미지</text>

  <!-- TBM Audio -->
  <rect x="30" y="185" width="140" height="70" rx="8" fill="#18181b" stroke="#27272a" filter="url(#shadow)"/>
  <text x="100" y="215" text-anchor="middle" fill="#a1a1aa" font-size="11">TBM 녹음</text>
  <text x="100" y="235" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">음성 파일</text>

  <!-- Site Photo -->
  <rect x="30" y="270" width="140" height="70" rx="8" fill="#18181b" stroke="#27272a" filter="url(#shadow)"/>
  <text x="100" y="300" text-anchor="middle" fill="#a1a1aa" font-size="11">현장 사진</text>
  <text x="100" y="320" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">이미지 파일</text>

  <!-- Master Plan -->
  <rect x="30" y="355" width="140" height="70" rx="8" fill="#18181b" stroke="#27272a" filter="url(#shadow)"/>
  <text x="100" y="385" text-anchor="middle" fill="#a1a1aa" font-size="11">프로젝트 설정</text>
  <text x="100" y="405" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="700">마스터 안전계획</text>

  <!-- ===== PROCESSING SECTION ===== -->
  <text x="290" y="85" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="1">PROCESSING</text>

  <!-- PDF.js -->
  <rect x="220" y="100" width="120" height="55" rx="8" fill="#27272a" stroke="#3f3f46" filter="url(#shadow)"/>
  <text x="280" y="125" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">PDF.js</text>
  <text x="280" y="143" text-anchor="middle" fill="#a1a1aa" font-size="10">텍스트 추출</text>

  <!-- Whisper -->
  <rect x="220" y="185" width="120" height="55" rx="8" fill="#27272a" stroke="#3f3f46" filter="url(#shadow)"/>
  <text x="280" y="210" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">Whisper</text>
  <text x="280" y="228" text-anchor="middle" fill="#a1a1aa" font-size="10">음성 → 텍스트</text>

  <!-- Claude Vision -->
  <rect x="220" y="270" width="120" height="55" rx="8" fill="#27272a" stroke="#3f3f46" filter="url(#shadow)"/>
  <text x="280" y="295" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">Claude Vision</text>
  <text x="280" y="313" text-anchor="middle" fill="#a1a1aa" font-size="10">이미지 분석</text>

  <!-- ===== AI EXTRACTION ===== -->
  <rect x="380" y="120" width="150" height="100" rx="10" fill="#1e3a2f" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="155" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">AI 문서 추출</text>
  <text x="455" y="175" text-anchor="middle" fill="#a1a1aa" font-size="10">Claude Sonnet 4.5</text>
  <text x="455" y="190" text-anchor="middle" fill="#a1a1aa" font-size="10">GPT-5.1 (fallback)</text>
  <text x="455" y="208" text-anchor="middle" fill="#71717a" font-size="9">필드, 체크리스트, 서명 추출</text>

  <!-- ===== 5-STAGE VALIDATION ===== -->
  <text x="600" y="85" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="1">5-STAGE VALIDATION ENGINE</text>

  <!-- Stage boxes -->
  <rect x="560" y="100" width="240" height="330" rx="12" fill="#18181b" stroke="#27272a" filter="url(#shadow)"/>

  <!-- Stage 1 -->
  <rect x="575" y="115" width="210" height="50" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="590" y="137" fill="#ef4444" font-size="10" font-weight="700">Stage 1</text>
  <text x="650" y="137" fill="#fafafa" font-size="11" font-weight="600">형식 검증</text>
  <text x="590" y="153" fill="#71717a" font-size="9">필수 필드, 서명, 날짜 확인</text>

  <!-- Stage 2 -->
  <rect x="575" y="175" width="210" height="50" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="590" y="197" fill="#f59e0b" font-size="10" font-weight="700">Stage 2</text>
  <text x="650" y="197" fill="#fafafa" font-size="11" font-weight="600">논리 검증</text>
  <text x="590" y="213" fill="#71717a" font-size="9">22개 규칙, 모순 탐지</text>

  <!-- Stage 3 -->
  <rect x="575" y="235" width="210" height="50" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="590" y="257" fill="#22c55e" font-size="10" font-weight="700">Stage 3</text>
  <text x="650" y="257" fill="#fafafa" font-size="11" font-weight="600">교차 분석</text>
  <text x="590" y="273" fill="#71717a" font-size="9">위험도 행렬, 문서간 비교, 사진 검증</text>

  <!-- Stage 4 -->
  <rect x="575" y="295" width="210" height="50" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="590" y="317" fill="#8b5cf6" font-size="10" font-weight="700">Stage 4</text>
  <text x="650" y="317" fill="#fafafa" font-size="11" font-weight="600">패턴 분석</text>
  <text x="590" y="333" fill="#71717a" font-size="9">복사-붙여넣기, 항상체크 감지</text>

  <!-- Stage 5 -->
  <rect x="575" y="355" width="210" height="50" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="590" y="377" fill="#06b6d4" font-size="10" font-weight="700">Stage 5</text>
  <text x="650" y="377" fill="#fafafa" font-size="11" font-weight="600">상황별 검토</text>
  <text x="590" y="393" fill="#71717a" font-size="9">AI 기반 맥락 안전 분석</text>

  <!-- ===== DATABASE ===== -->
  <text x="455" y="280" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="1">DATABASE</text>

  <!-- DB cylinder -->
  <ellipse cx="455" cy="310" rx="55" ry="15" fill="#27272a" stroke="#3f3f46"/>
  <rect x="400" y="310" width="110" height="70" fill="#27272a" stroke="#3f3f46"/>
  <ellipse cx="455" cy="380" rx="55" ry="15" fill="#27272a" stroke="#3f3f46"/>
  <ellipse cx="455" cy="310" rx="55" ry="15" fill="#18181b" stroke="#3f3f46"/>

  <text x="455" y="340" text-anchor="middle" fill="#fafafa" font-size="11" font-weight="600">SQLite / Postgres</text>
  <text x="455" y="358" text-anchor="middle" fill="#71717a" font-size="9">검증 기록, 프로젝트</text>
  <text x="455" y="373" text-anchor="middle" fill="#71717a" font-size="9">점검자 패턴 이력</text>

  <!-- ===== OUTPUT SECTION ===== -->
  <text x="880" y="85" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="1">OUTPUT</text>

  <!-- Issues List -->
  <rect x="840" y="100" width="140" height="65" rx="8" fill="#18181b" stroke="#ef4444" filter="url(#shadow)"/>
  <text x="910" y="125" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">문제점 목록</text>
  <text x="910" y="145" text-anchor="middle" fill="#a1a1aa" font-size="10">심각도별 분류</text>
  <text x="910" y="158" text-anchor="middle" fill="#71717a" font-size="9">KOSHA 기준 참조</text>

  <!-- Risk Score -->
  <rect x="840" y="180" width="140" height="65" rx="8" fill="#18181b" stroke="#f59e0b" filter="url(#shadow)"/>
  <text x="910" y="205" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">위험도 점수</text>
  <text x="910" y="225" text-anchor="middle" fill="#a1a1aa" font-size="10">0-100 객관적 산출</text>
  <text x="910" y="238" text-anchor="middle" fill="#71717a" font-size="9">요인별 분석 제공</text>

  <!-- PDF Report -->
  <rect x="840" y="260" width="140" height="65" rx="8" fill="#18181b" stroke="#22c55e" filter="url(#shadow)"/>
  <text x="910" y="285" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">PDF 리포트</text>
  <text x="910" y="305" text-anchor="middle" fill="#a1a1aa" font-size="10">종합 검증 결과</text>
  <text x="910" y="318" text-anchor="middle" fill="#71717a" font-size="9">TBM 요약 포함</text>

  <!-- AI Chat -->
  <rect x="840" y="340" width="140" height="65" rx="8" fill="#18181b" stroke="#8b5cf6" filter="url(#shadow)"/>
  <text x="910" y="365" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">AI 채팅</text>
  <text x="910" y="385" text-anchor="middle" fill="#a1a1aa" font-size="10">문서 기반 Q&amp;A</text>
  <text x="910" y="398" text-anchor="middle" fill="#71717a" font-size="9">개선 방안 도출</text>

  <!-- ===== ARROWS ===== -->
  <!-- Input to Processing -->
  <path d="M170 135 L215 135" stroke="#3f3f46" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M170 212 L215 212" stroke="#3f3f46" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M170 305 L215 305" stroke="#3f3f46" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Processing to AI Extraction -->
  <path d="M340 127 L375 150" stroke="#3f3f46" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 212 L375 175" stroke="#3f3f46" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 297 L375 200" stroke="#3f3f46" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- AI Extraction to Validation -->
  <path d="M530 170 L555 200" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Database connections -->
  <path d="M455 295 L455 250 L530 220" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
  <path d="M510 345 L520 345" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4" fill="none"/>

  <!-- Master Plan to Database -->
  <path d="M170 390 L395 350" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4" fill="none"/>

  <!-- Validation to Output -->
  <path d="M800 215 L835 215" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f3f46"/>
    </marker>
  </defs>

  <!-- ===== TECH STACK FOOTER ===== -->
  <rect x="30" y="480" width="1140" height="80" rx="10" fill="#18181b" stroke="#27272a"/>
  <text x="60" y="510" fill="#22c55e" font-size="11" font-weight="700">TECH STACK</text>

  <text x="60" y="535" fill="#a1a1aa" font-size="10">Framework:</text>
  <text x="130" y="535" fill="#fafafa" font-size="10" font-weight="600">Next.js 14</text>

  <text x="220" y="535" fill="#a1a1aa" font-size="10">Language:</text>
  <text x="285" y="535" fill="#fafafa" font-size="10" font-weight="600">TypeScript</text>

  <text x="370" y="535" fill="#a1a1aa" font-size="10">Styling:</text>
  <text x="420" y="535" fill="#fafafa" font-size="10" font-weight="600">Tailwind CSS</text>

  <text x="520" y="535" fill="#a1a1aa" font-size="10">Database:</text>
  <text x="585" y="535" fill="#fafafa" font-size="10" font-weight="600">SQLite / Postgres</text>

  <text x="710" y="535" fill="#a1a1aa" font-size="10">ORM:</text>
  <text x="745" y="535" fill="#fafafa" font-size="10" font-weight="600">Prisma v5</text>

  <text x="830" y="535" fill="#a1a1aa" font-size="10">AI:</text>
  <text x="850" y="535" fill="#fafafa" font-size="10" font-weight="600">Claude Sonnet 4.5 / GPT-5.1</text>

  <text x="1030" y="535" fill="#a1a1aa" font-size="10">PDF:</text>
  <text x="1060" y="535" fill="#fafafa" font-size="10" font-weight="600">PDF.js</text>

  <!-- Rule count badge -->
  <rect x="1000" y="100" width="170" height="50" rx="8" fill="#1e3a2f" stroke="#22c55e"/>
  <text x="1085" y="125" text-anchor="middle" fill="#22c55e" font-size="24" font-weight="900">50+</text>
  <text x="1085" y="142" text-anchor="middle" fill="#a1a1aa" font-size="10">검증 규칙</text>
</svg>