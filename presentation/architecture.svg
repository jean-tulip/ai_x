<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Noto Sans KR', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#18181b" font-size="20" font-weight="700">시스템 구성</text>

  <!-- ===== INPUT SECTION ===== -->
  <text x="100" y="85" fill="#16a34a" font-size="12" font-weight="700" letter-spacing="1">INPUT</text>

  <!-- PDF/Image Upload -->
  <rect x="30" y="100" width="140" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <text x="100" y="130" text-anchor="middle" fill="#6b7280" font-size="11">사용자 업로드</text>
  <text x="100" y="150" text-anchor="middle" fill="#18181b" font-size="13" font-weight="700">PDF / 이미지</text>

  <!-- TBM Audio -->
  <rect x="30" y="185" width="140" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <text x="100" y="215" text-anchor="middle" fill="#6b7280" font-size="11">TBM 녹음</text>
  <text x="100" y="235" text-anchor="middle" fill="#18181b" font-size="13" font-weight="700">음성 파일</text>

  <!-- Site Photo -->
  <rect x="30" y="270" width="140" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <text x="100" y="300" text-anchor="middle" fill="#6b7280" font-size="11">현장 사진</text>
  <text x="100" y="320" text-anchor="middle" fill="#18181b" font-size="13" font-weight="700">이미지 파일</text>

  <!-- Master Plan -->
  <rect x="30" y="355" width="140" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <text x="100" y="385" text-anchor="middle" fill="#6b7280" font-size="11">프로젝트 설정</text>
  <text x="100" y="405" text-anchor="middle" fill="#18181b" font-size="13" font-weight="700">마스터 안전계획</text>

  <!-- ===== PROCESSING SECTION ===== -->
  <!-- Non-AI Processing -->
  <text x="250" y="85" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="1">전처리</text>

  <!-- PDF.js (Non-AI) -->
  <rect x="210" y="100" width="100" height="55" rx="8" fill="#f3f4f6" stroke="#d1d5db" filter="url(#shadow)"/>
  <text x="260" y="125" text-anchor="middle" fill="#374151" font-size="11" font-weight="700">PDF.js</text>
  <text x="260" y="143" text-anchor="middle" fill="#6b7280" font-size="10">텍스트 추출</text>

  <!-- AI Processing Label -->
  <text x="250" y="175" fill="#8b5cf6" font-size="10" font-weight="700" letter-spacing="1">AI 전처리</text>

  <!-- Whisper (AI) -->
  <rect x="210" y="185" width="100" height="55" rx="8" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#shadow)"/>
  <text x="260" y="210" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">Whisper</text>
  <text x="260" y="228" text-anchor="middle" fill="#6b7280" font-size="10">음성 → 텍스트</text>

  <!-- GPT Vision (AI) -->
  <rect x="210" y="270" width="100" height="55" rx="8" fill="#f5f3ff" stroke="#8b5cf6" filter="url(#shadow)"/>
  <text x="260" y="295" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">GPT-4o Vision</text>
  <text x="260" y="313" text-anchor="middle" fill="#6b7280" font-size="10">이미지 분석</text>

  <!-- ===== AI EXTRACTION ===== -->
  <rect x="350" y="120" width="150" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="155" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="700">AI 문서 추출</text>
  <text x="425" y="175" text-anchor="middle" fill="#374151" font-size="10">Claude Sonnet 4</text>
  <text x="425" y="190" text-anchor="middle" fill="#374151" font-size="10">GPT-4o (fallback)</text>
  <text x="425" y="208" text-anchor="middle" fill="#6b7280" font-size="9">필드, 체크리스트, 서명 추출</text>

  <!-- ===== 5-STAGE VALIDATION ===== -->
  <text x="600" y="85" fill="#16a34a" font-size="12" font-weight="700" letter-spacing="1">5-STAGE VALIDATION ENGINE</text>

  <!-- Stage boxes -->
  <rect x="540" y="100" width="250" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>

  <!-- Stage 1 -->
  <rect x="555" y="115" width="220" height="50" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="570" y="137" fill="#dc2626" font-size="10" font-weight="700">Stage 1</text>
  <text x="630" y="137" fill="#18181b" font-size="11" font-weight="600">형식 검증</text>
  <text x="570" y="153" fill="#6b7280" font-size="9">필수 필드, 서명, 날짜 확인</text>

  <!-- Stage 2 -->
  <rect x="555" y="175" width="220" height="50" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="570" y="197" fill="#d97706" font-size="10" font-weight="700">Stage 2</text>
  <text x="630" y="197" fill="#18181b" font-size="11" font-weight="600">논리 검증</text>
  <text x="570" y="213" fill="#6b7280" font-size="9">22개 규칙, 모순 탐지</text>

  <!-- Stage 3 -->
  <rect x="555" y="235" width="220" height="50" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="570" y="257" fill="#16a34a" font-size="10" font-weight="700">Stage 3</text>
  <text x="630" y="257" fill="#18181b" font-size="11" font-weight="600">교차 분석</text>
  <text x="570" y="273" fill="#6b7280" font-size="9">위험도 행렬, 문서간 비교, 사진 검증</text>

  <!-- Stage 4 -->
  <rect x="555" y="295" width="220" height="50" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="570" y="317" fill="#7c3aed" font-size="10" font-weight="700">Stage 4</text>
  <text x="630" y="317" fill="#18181b" font-size="11" font-weight="600">패턴 분석</text>
  <text x="570" y="333" fill="#6b7280" font-size="9">복사-붙여넣기, 항상체크 감지</text>

  <!-- Stage 5 -->
  <rect x="555" y="355" width="220" height="50" rx="6" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="570" y="377" fill="#0891b2" font-size="10" font-weight="700">Stage 5</text>
  <text x="630" y="377" fill="#18181b" font-size="11" font-weight="600">상황별 검토</text>
  <text x="570" y="393" fill="#6b7280" font-size="9">AI 기반 맥락 안전 분석</text>

  <!-- ===== DATABASE ===== -->
  <text x="425" y="280" fill="#16a34a" font-size="12" font-weight="700" letter-spacing="1">DATABASE</text>

  <!-- DB cylinder -->
  <ellipse cx="425" cy="310" rx="55" ry="15" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="370" y="310" width="110" height="70" fill="#e5e7eb" stroke="#d1d5db"/>
  <ellipse cx="425" cy="380" rx="55" ry="15" fill="#e5e7eb" stroke="#d1d5db"/>
  <ellipse cx="425" cy="310" rx="55" ry="15" fill="#f3f4f6" stroke="#d1d5db"/>

  <text x="425" y="340" text-anchor="middle" fill="#18181b" font-size="11" font-weight="600">SQLite / Postgres</text>
  <text x="425" y="358" text-anchor="middle" fill="#6b7280" font-size="9">검증 기록, 프로젝트</text>
  <text x="425" y="373" text-anchor="middle" fill="#6b7280" font-size="9">점검자 패턴 이력</text>

  <!-- ===== OUTPUT SECTION ===== -->
  <text x="880" y="85" fill="#16a34a" font-size="12" font-weight="700" letter-spacing="1">OUTPUT</text>

  <!-- Issues List -->
  <rect x="840" y="100" width="140" height="65" rx="8" fill="#ffffff" stroke="#dc2626" filter="url(#shadow)"/>
  <text x="910" y="125" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">문제점 목록</text>
  <text x="910" y="145" text-anchor="middle" fill="#6b7280" font-size="10">심각도별 분류</text>
  <text x="910" y="158" text-anchor="middle" fill="#9ca3af" font-size="9">KOSHA 기준 참조</text>

  <!-- Risk Score -->
  <rect x="840" y="180" width="140" height="65" rx="8" fill="#ffffff" stroke="#d97706" filter="url(#shadow)"/>
  <text x="910" y="205" text-anchor="middle" fill="#d97706" font-size="11" font-weight="700">위험도 점수</text>
  <text x="910" y="225" text-anchor="middle" fill="#6b7280" font-size="10">0-100 객관적 산출</text>
  <text x="910" y="238" text-anchor="middle" fill="#9ca3af" font-size="9">요인별 분석 제공</text>

  <!-- PDF Report -->
  <rect x="840" y="260" width="140" height="65" rx="8" fill="#ffffff" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="910" y="285" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">PDF 리포트</text>
  <text x="910" y="305" text-anchor="middle" fill="#6b7280" font-size="10">종합 검증 결과</text>
  <text x="910" y="318" text-anchor="middle" fill="#9ca3af" font-size="9">TBM 요약 포함</text>

  <!-- AI Chat -->
  <rect x="840" y="340" width="140" height="65" rx="8" fill="#ffffff" stroke="#7c3aed" filter="url(#shadow)"/>
  <text x="910" y="365" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">AI 채팅</text>
  <text x="910" y="385" text-anchor="middle" fill="#6b7280" font-size="10">문서 기반 Q&amp;A</text>
  <text x="910" y="398" text-anchor="middle" fill="#9ca3af" font-size="9">개선 방안 도출</text>

  <!-- ===== ARROWS ===== -->
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Input to Processing -->
  <path d="M170 135 L205 135" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M170 212 L205 212" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M170 305 L205 305" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Processing to AI Extraction -->
  <path d="M310 127 L345 150" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M310 212 L345 175" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M310 297 L345 200" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- AI Extraction to Validation -->
  <path d="M500 170 L535 200" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Database connections -->
  <path d="M425 295 L425 250 L500 220" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
  <path d="M480 345 L520 345" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4" fill="none"/>

  <!-- Master Plan to Database -->
  <path d="M170 390 L365 350" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4" fill="none"/>

  <!-- Validation to Output -->
  <path d="M790 265 L835 215" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Rule count badge -->
  <rect x="1000" y="100" width="170" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1085" y="125" text-anchor="middle" fill="#16a34a" font-size="24" font-weight="900">50+</text>
  <text x="1085" y="142" text-anchor="middle" fill="#6b7280" font-size="10">검증 규칙</text>
</svg>
